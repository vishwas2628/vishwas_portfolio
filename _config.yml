# Markdown & Syntax Highlighting
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

permalink: /blog/:year/:month/:day/:title/

# Custom Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Front Matter Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - vendor
  - .bundle
  - Gemfile.lock
  - node_modules
  - .env
  - .idea
  - README.md
