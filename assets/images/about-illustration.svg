<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3f75" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4a749c" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3f75"/>
      <stop offset="100%" stop-color="#4a749c"/>
    </linearGradient>
    <linearGradient id="codeScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00002a"/>
      <stop offset="100%" stop-color="#091338"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00002a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="380" rx="24" fill="url(#aboutBg)"/>

  <!-- Grid Tech Lines -->
  <g stroke="#8ca9c4" stroke-opacity="0.2" stroke-width="1">
    <line x1="40" y1="70" x2="760" y2="70"/>
    <line x1="40" y1="150" x2="760" y2="150"/>
    <line x1="40" y1="230" x2="760" y2="230"/>
    <line x1="40" y1="310" x2="760" y2="310"/>
    <line x1="160" y1="30" x2="160" y2="350"/>
    <line x1="320" y1="30" x2="320" y2="350"/>
    <line x1="480" y1="30" x2="480" y2="350"/>
    <line x1="640" y1="30" x2="640" y2="350"/>
  </g>

  <!-- Desk Surface -->
  <path d="M 80 320 L 720 320" stroke="#c8daf0" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="324" x2="120" y2="355" stroke="#c8daf0" stroke-width="4" stroke-linecap="round"/>
  <line x1="680" y1="324" x2="680" y2="355" stroke="#c8daf0" stroke-width="4" stroke-linecap="round"/>

  <!-- Left Main Monitor: Full Stack Code & Architecture -->
  <g transform="translate(120, 70)" filter="url(#shadow)">
    <!-- Monitor Stand -->
    <rect x="135" y="210" width="30" height="35" rx="3" fill="#8ca9c4"/>
    <path d="M 100 245 L 200 245" stroke="#4a749c" stroke-width="5" stroke-linecap="round"/>

    <!-- Screen Frame -->
    <rect x="0" y="0" width="300" height="210" rx="14" fill="#00002a" stroke="#1a3f75" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="28" rx="14" fill="#0a1736"/>
    <rect x="0" y="16" width="300" height="12" fill="#0a1736"/>
    
    <!-- Dots -->
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <circle cx="30" cy="14" r="4" fill="#eab308"/>
    <circle cx="44" cy="14" r="4" fill="#22c55e"/>
    <text x="60" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8ca9c4">vishwas@backend-core: ~</text>

    <!-- Code Editor Content -->
    <g transform="translate(16, 44)" font-family="'JetBrains Mono', monospace" font-size="9.5">
      <text x="0" y="12" fill="#4a749c"># Full-Stack &amp; Telephony Engineer</text>
      <text x="0" y="28" fill="#34d399">class</text>
      <text x="42" y="28" fill="#d4e4f5" font-weight="700">DeveloperProfile</text>
      <text x="145" y="28" fill="#8ca9c4">:</text>
      
      <text x="14" y="44" fill="#8ca9c4">name =</text>
      <text x="65" y="44" fill="#fbbf24">"Vishwas Chourasiya"</text>
      
      <text x="14" y="60" fill="#8ca9c4">role =</text>
      <text x="65" y="60" fill="#fbbf24">"Associate Software Developer"</text>
      
      <text x="14" y="76" fill="#8ca9c4">stack = [</text>
      <text x="65" y="76" fill="#60a5fa">"Python"</text>
      <text x="118" y="76" fill="#8ca9c4">, </text>
      <text x="128" y="76" fill="#60a5fa">"Django"</text>
      <text x="180" y="76" fill="#8ca9c4">, </text>
      <text x="190" y="76" fill="#60a5fa">"Node.js"</text>
      <text x="240" y="76" fill="#8ca9c4">]</text>

      <text x="14" y="92" fill="#8ca9c4">telephony =</text>
      <text x="90" y="92" fill="#fbbf24">"Asterisk PBX / IVR"</text>

      <text x="14" y="108" fill="#8ca9c4">repos =</text>
      <text x="65" y="108" fill="#34d399">35</text>
      <text x="85" y="108" fill="#4a749c"># Open-Source Repos</text>

      <text x="14" y="128" fill="#34d399">def</text>
      <text x="40" y="128" fill="#60a5fa">build_scalable_systems</text>
      <text x="175" y="128" fill="#8ca9c4">():</text>

      <text x="28" y="144" fill="#34d399">return</text>
      <text x="75" y="144" fill="#fbbf24">"High Performance &amp; Low Latency 🚀"</text>
    </g>
  </g>

  <!-- Right Secondary Monitor: Real-Time Telephony / Telemetry -->
  <g transform="translate(450, 90)" filter="url(#shadow)">
    <!-- Stand -->
    <rect x="110" y="190" width="24" height="30" rx="3" fill="#8ca9c4"/>
    <path d="M 80 220 L 165 220" stroke="#4a749c" stroke-width="4" stroke-linecap="round"/>

    <!-- Screen Frame -->
    <rect x="0" y="0" width="240" height="190" rx="12" fill="#091338" stroke="#4a749c" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="26" rx="12" fill="#132448"/>
    <rect x="0" y="14" width="240" height="12" fill="#132448"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ef4444"/>
    <circle cx="26" cy="13" r="3.5" fill="#eab308"/>
    <circle cx="38" cy="13" r="3.5" fill="#22c55e"/>
    <text x="50" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8ca9c4">Asterisk IVR Monitor</text>

    <!-- Telephony Waveforms & Visualizer -->
    <g transform="translate(14, 40)">
      <!-- Audio Wave Graph -->
      <path d="M 0 35 Q 25 5, 50 35 T 100 35 T 150 15 T 200 35" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 35 Q 25 55, 50 35 T 100 35 T 150 50 T 200 35" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Live Telephony Stats -->
      <rect x="0" y="60" width="98" height="42" rx="6" fill="#00002a" stroke="#1a3f75" stroke-width="1"/>
      <text x="8" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#8ca9c4">FastAGI Status</text>
      <text x="8" y="92" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">ACTIVE ●</text>

      <rect x="108" y="60" width="98" height="42" rx="6" fill="#00002a" stroke="#1a3f75" stroke-width="1"/>
      <text x="116" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#8ca9c4">Latency</text>
      <text x="116" y="92" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60a5fa">12 ms</text>

      <!-- Event Stream -->
      <text x="4" y="125" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8ca9c4">&gt; SIP Inbound 200 OK</text>
      <text x="4" y="137" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399">&gt; FastAGI /ivr-dispatch</text>
    </g>
  </g>

  <!-- Workspace Accessories: Coffee Mug & Keyboard -->
  <g transform="translate(80, 275)">
    <!-- Coffee Mug -->
    <rect x="0" y="10" width="22" height="28" rx="4" fill="#ffffff" stroke="#c8daf0" stroke-width="2"/>
    <path d="M 22 16 C 30 16, 30 28, 22 28" fill="none" stroke="#c8daf0" stroke-width="2"/>
    <!-- Steam -->
    <path d="M 7 5 Q 11 0, 7 -5" fill="none" stroke="#8ca9c4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 15 7 Q 19 2, 15 -3" fill="none" stroke="#8ca9c4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Keyboard & Mouse Pad -->
  <g transform="translate(200, 290)">
    <rect x="0" y="0" width="160" height="20" rx="4" fill="#ffffff" stroke="#c8daf0" stroke-width="1.5"/>
    <rect x="175" y="2" width="22" height="16" rx="4" fill="#ffffff" stroke="#c8daf0" stroke-width="1.5"/>
    <line x1="186" y1="2" x2="186" y2="8" stroke="#8ca9c4" stroke-width="1"/>
  </g>

  <!-- Floating Tech Badges / Skills in Background -->
  <g transform="translate(40, 50)" filter="url(#shadow)">
    <rect width="64" height="28" rx="8" fill="#ffffff" stroke="#c8daf0" stroke-width="1.5"/>
    <text x="32" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1a3f75">Python</text>
  </g>

  <g transform="translate(700, 50)" filter="url(#shadow)">
    <rect width="64" height="28" rx="8" fill="#1a3f75"/>
    <text x="32" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Node.js</text>
  </g>

  <g transform="translate(680, 270)" filter="url(#shadow)">
    <rect width="76" height="28" rx="8" fill="#ffffff" stroke="#c8daf0" stroke-width="1.5"/>
    <text x="38" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#4a749c">Asterisk</text>
  </g>
</svg>