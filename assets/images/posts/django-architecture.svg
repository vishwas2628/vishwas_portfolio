<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="djangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00002a"/>
      <stop offset="60%" stop-color="#071b2e"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="djangoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4a749c"/>
    </linearGradient>
    <filter id="djangoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="700" height="380" rx="18" fill="url(#djangoGrad)"/>

  <!-- Architecture Flow Layers -->
  <g transform="translate(60, 90)" filter="url(#djangoGlow)">
    <!-- Layer 1: API / Views -->
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#0a1736" stroke="#4a749c" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#d4e4f5">REST Views &amp; APIs</text>
    <text x="80" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8ca9c4">Fast Inbound Router</text>

    <!-- Arrow down -->
    <path d="M 80 65 L 80 95" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="80,98 75,90 85,90" fill="#22c55e"/>

    <!-- Layer 2: Service Layer (Decoupled Logic) -->
    <rect x="0" y="105" width="160" height="65" rx="10" fill="#13284f" stroke="#22c55e" stroke-width="2"/>
    <text x="80" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399">Service Layer</text>
    <text x="80" y="152" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#d4e4f5">Pure Business Logic</text>

    <!-- Arrow down -->
    <path d="M 80 175 L 80 205" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="80,208 75,200 85,200" fill="#22c55e"/>

    <!-- Layer 3: Optimized ORM & DB -->
    <rect x="0" y="215" width="160" height="60" rx="10" fill="#0a1736" stroke="#4a749c" stroke-width="2"/>
    <text x="80" y="242" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#d4e4f5">PostgreSQL / ORM</text>
    <text x="80" y="260" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">select_related() Opt</text>
  </g>

  <!-- Right Code Window (Clean Django Optimization) -->
  <g transform="translate(270, 75)" filter="url(#djangoGlow)">
    <rect width="370" height="240" rx="14" fill="#00001c" stroke="#1a3f75" stroke-width="2"/>
    <rect width="370" height="32" rx="14" fill="#091338"/>
    <rect y="18" width="370" height="14" fill="#091338"/>
    
    <circle cx="18" cy="16" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="16" r="4.5" fill="#eab308"/>
    <circle cx="46" cy="16" r="4.5" fill="#22c55e"/>
    <text x="62" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8ca9c4">services/order_service.py</text>

    <g transform="translate(18, 48)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <text x="0" y="16" fill="#4a749c"># Eliminate N+1 SQL queries</text>
      <text x="0" y="36" fill="#34d399">def</text>
      <text x="32" y="36" fill="#60a5fa">get_optimized_orders</text>
      <text x="195" y="36" fill="#d4e4f5">(user_id):</text>

      <text x="16" y="60" fill="#34d399">return</text>
      <text x="70" y="60" fill="#d4e4f5">Order.objects.filter(</text>
      
      <text x="32" y="80" fill="#8ca9c4">user_id=user_id</text>
      <text x="32" y="100" fill="#d4e4f5">).<tspan fill="#34d399" font-weight="700">select_related</tspan>(</text>
      <text x="48" y="120" fill="#fbbf24">'user'</text>
      <text x="92" y="120" fill="#8ca9c4">, </text>
      <text x="105" y="120" fill="#fbbf24">'payment_profile'</text>
      <text x="32" y="140" fill="#d4e4f5">).<tspan fill="#34d399" font-weight="700">prefetch_related</tspan>(</text>
      <text x="48" y="160" fill="#fbbf24">'items__product'</text>
      <text x="32" y="180" fill="#d4e4f5">)</text>
    </g>
  </g>

  <!-- Top Category Pill -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="13" fill="#091338" stroke="#22c55e" stroke-width="1"/>
    <text x="90" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#34d399">PYTHON &amp; DJANGO CORE</text>
  </g>
</svg>