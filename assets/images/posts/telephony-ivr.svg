<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="telephonyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00002a"/>
      <stop offset="50%" stop-color="#091338"/>
      <stop offset="100%" stop-color="#132448"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="postGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" rx="18" fill="url(#telephonyGrad)"/>

  <!-- Network Circuit Grid -->
  <g stroke="#1a3f75" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="80" x2="700" y2="80"/>
    <line x1="0" y1="160" x2="700" y2="160"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="320" x2="700" y2="320"/>
    <line x1="140" y1="0" x2="140" y2="380"/>
    <line x1="280" y1="0" x2="280" y2="380"/>
    <line x1="420" y1="0" x2="420" y2="380"/>
    <line x1="560" y1="0" x2="560" y2="380"/>
  </g>

  <!-- Node 1: SIP Caller Inbound -->
  <g transform="translate(60, 140)" filter="url(#postGlow)">
    <circle cx="45" cy="45" r="42" fill="#0a1736" stroke="#4a749c" stroke-width="2"/>
    <path d="M 32 36 C 32 30, 40 28, 45 34 L 50 39 C 53 42, 53 46, 49 50 C 44 55, 38 52, 34 46 C 30 40, 32 36, 32 36 Z" fill="#60a5fa"/>
    <text x="45" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#d4e4f5">SIP Trunk</text>
    <text x="45" y="120" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8ca9c4">Inbound Call</text>
  </g>

  <!-- Flow Line 1 -->
  <path d="M 155 185 L 235 185" stroke="url(#accentLine)" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  <polygon points="240,185 230,180 230,190" fill="#34d399"/>

  <!-- Node 2: Asterisk PBX Core -->
  <g transform="translate(250, 110)" filter="url(#postGlow)">
    <rect width="180" height="150" rx="14" fill="#0a1736" stroke="#1a3f75" stroke-width="2"/>
    <rect width="180" height="32" rx="14" fill="#132448"/>
    <rect y="18" width="180" height="14" fill="#132448"/>
    <text x="90" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ffffff">ASTERISK PBX</text>

    <!-- Asterisk Star Icon -->
    <g transform="translate(90, 75)">
      <circle cx="0" cy="0" r="22" fill="#1a3f75" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="-12" y1="-7" x2="12" y2="7" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="-12" y1="7" x2="12" y2="-7" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="90" y="118" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">FastAGI + AMI</text>
    <text x="90" y="134" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#8ca9c4">Dynamic Call Tree</text>
  </g>

  <!-- Flow Line 2 -->
  <path d="M 435 185 L 515 185" stroke="url(#accentLine)" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  <polygon points="520,185 510,180 510,190" fill="#34d399"/>

  <!-- Node 3: Node.js & WebSocket State Layer -->
  <g transform="translate(530, 120)" filter="url(#postGlow)">
    <rect width="130" height="130" rx="14" fill="#0a1736" stroke="#34d399" stroke-width="2"/>
    
    <!-- Node.js Logo Hexagon -->
    <polygon points="65,30 95,47 95,83 65,100 35,83 35,47" fill="#132448" stroke="#34d399" stroke-width="1.5"/>
    <text x="65" y="70" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#34d399">JS</text>
    
    <text x="65" y="120" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#d4e4f5">Node.js Gateway</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="26" rx="13" fill="#132448" stroke="#4a749c" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#60a5fa">TELEPHONY &amp; IVR</text>
  </g>

  <!-- Live Audio Waves at Bottom -->
  <g transform="translate(240, 310)">
    <path d="M 0 20 Q 25 -5, 50 20 T 100 20 T 150 5 T 200 20 T 250 10 T 300 20" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <text x="150" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8ca9c4">Real-Time Voice Stream &amp; WebSockets</text>
  </g>
</svg>