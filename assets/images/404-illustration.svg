<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3f75" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4a749c" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3f75"/>
      <stop offset="100%" stop-color="#4a749c"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00002a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Digital Grid Pattern -->
  <g stroke="#8ca9c4" stroke-opacity="0.2" stroke-width="1">
    <line x1="60" y1="60" x2="540" y2="60" />
    <line x1="60" y1="130" x2="540" y2="130" />
    <line x1="60" y1="200" x2="540" y2="200" />
    <line x1="60" y1="270" x2="540" y2="270" />
    <line x1="60" y1="340" x2="540" y2="340" />
    <line x1="120" y1="30" x2="120" y2="370" />
    <line x1="220" y1="30" x2="220" y2="370" />
    <line x1="320" y1="30" x2="320" y2="370" />
    <line x1="420" y1="30" x2="420" y2="370" />
    <line x1="520" y1="30" x2="520" y2="370" />
  </g>

  <!-- Constellations / Nodes -->
  <circle cx="100" cy="80" r="4" fill="#1a3f75" opacity="0.7"/>
  <circle cx="500" cy="90" r="5" fill="#4a749c" opacity="0.6"/>
  <circle cx="530" cy="240" r="4" fill="#8ca9c4" opacity="0.8"/>
  <circle cx="80" cy="300" r="3" fill="#1a3f75" opacity="0.5"/>
  <line x1="100" y1="80" x2="160" y2="110" stroke="#8ca9c4" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="500" y1="90" x2="460" y2="140" stroke="#8ca9c4" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Radar / Broken Beacon Orbit -->
  <g transform="translate(100, 110)">
    <circle cx="20" cy="20" r="16" fill="#1a3f75" />
    <circle cx="20" cy="20" r="8" fill="#d4e4f5" />
    <rect x="-12" y="16" width="10" height="8" rx="2" fill="#4a749c"/>
    <rect x="22" y="16" width="10" height="8" rx="2" fill="#4a749c"/>
    <line x1="20" y1="4" x2="20" y2="-8" stroke="#8ca9c4" stroke-width="2"/>
    <circle cx="20" cy="-9" r="3.5" fill="#ef4444"/>
    <path d="M 38 4 A 20 20 0 0 1 46 26" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 46 -2 A 28 28 0 0 1 56 30" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,4"/>
  </g>

  <!-- Central 404 Visual Console Card -->
  <g transform="translate(150, 75)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="300" height="230" rx="16" fill="#ffffff" stroke="#c8daf0" stroke-width="2"/>
    
    <!-- Top Header Bar -->
    <rect x="0" y="0" width="300" height="42" rx="16" fill="#e5eff8"/>
    <rect x="0" y="24" width="300" height="18" fill="#e5eff8"/>
    <line x1="0" y1="42" x2="300" y2="42" stroke="#c8daf0" stroke-width="1.5"/>

    <!-- Window Action Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5.5" fill="#eab308"/>
    <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>

    <!-- URL Indicator -->
    <rect x="85" y="12" width="195" height="20" rx="6" fill="#ffffff" stroke="#d4e4f5" stroke-width="1"/>
    <circle cx="98" cy="22" r="3" fill="#ef4444"/>
    <text x="108" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4a749c">error://page_not_found</text>

    <!-- Large 404 Typography -->
    <text x="150" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="76" fill="url(#accentGrad)" letter-spacing="4">404</text>
    
    <!-- Broken Route Graphic -->
    <g transform="translate(45, 155)">
      <path d="M 20 20 C 50 35, 70 5, 95 18" fill="none" stroke="#1a3f75" stroke-width="4" stroke-linecap="round"/>
      <rect x="92" y="12" width="12" height="12" rx="3" fill="#1a3f75"/>
      <line x1="104" y1="15" x2="110" y2="15" stroke="#8ca9c4" stroke-width="2"/>
      <line x1="104" y1="21" x2="110" y2="21" stroke="#8ca9c4" stroke-width="2"/>

      <!-- Disconnect Spark -->
      <circle cx="118" cy="18" r="3.5" fill="#eab308"/>
      <line x1="114" y1="10" x2="122" y2="26" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
      <line x1="122" y1="10" x2="114" y2="26" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>

      <rect x="126" y="12" width="12" height="12" rx="3" fill="#4a749c"/>
      <path d="M 138 18 C 160 32, 175 10, 200 20" fill="none" stroke="#4a749c" stroke-width="4" stroke-linecap="round"/>
      <line x1="120" y1="15" x2="126" y2="15" stroke="#8ca9c4" stroke-width="2"/>
      <line x1="120" y1="21" x2="126" y2="21" stroke="#8ca9c4" stroke-width="2"/>
    </g>

    <!-- Subtitle Pill inside card -->
    <rect x="75" y="195" width="150" height="22" rx="11" fill="#f2f6fa"/>
    <text x="150" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1a3f75">RESOURCE DISCONNECTED</text>
  </g>

  <!-- Status Badges -->
  <g transform="translate(60, 275)" filter="url(#cardGlow)">
    <rect width="115" height="42" rx="10" fill="#ffffff" stroke="#c8daf0" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#00002a">Status</text>
    <text x="32" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a749c">HTTP 404</text>
  </g>

  <g transform="translate(425, 275)" filter="url(#cardGlow)">
    <rect width="125" height="42" rx="10" fill="#1a3f75"/>
    <circle cx="22" cy="21" r="5" fill="#34d399"/>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Safe Recovery</text>
    <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" fill="#d4e4f5">Navigate Home</text>
  </g>
</svg>